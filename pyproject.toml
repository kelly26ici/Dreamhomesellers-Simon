[project]
name = "simon"
version = "0.1.0"
description = "Simon — the Dreamhomesellers property concierge. A LangChain v1 agent that helps buyers search and filter listings, and helps sellers post them, on top of the shared property pool."
readme = "AGENTS.md"
authors = [
    { name = "kelly26ici", email = "rexk638@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "supabase>=2.32.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
simon = "simon.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F are the correctness floor. I is import order. UP is py3.13 modernity.
# B is bugbear, which catches the mutable-default and except-pass classes of
# mistake that survive review. SIM keeps the code honest without contorting it.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to import in any order and to shadow names for clarity.
"tests/*" = ["E402", "B008"]
