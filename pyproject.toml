[project]
name = "simon"
version = "0.1.0"
description = "Simon — the Dreamhomesellers property concierge. A LangChain v1 agent that helps buyers search and filter listings, and helps sellers post them, on top of the shared property pool."
readme = "README.md"
authors = [
    { name = "kelly26ici", email = "rexk638@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.7.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "supabase>=2.32.0",
]

[dependency-groups]
dev = [
    "chainlit==2.12.0",
]

[project.scripts]
simon = "simon.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
